<!DOCTYPE html>
<html>
<head>
  <title>Dispersals Live</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      transition: 0.3s;
    }

    body.dark { background: black; color: white; }
    body.light { background: #f1f5f9; color: black; }
    body.neon { background: #030712; color: #39ff14; }

    #audioGate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .gate-logo {
      max-width: 600px;
      height: auto;
      margin-bottom: 30px;
      object-fit: contain;
    }

    #audioGate button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 20px #facc15;
    }

    header {
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      background: #111827;
      color: yellow;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .live-clock {
      font-size: 20px;
      font-weight: bold;
      color: #9ca3af;
      font-family: monospace;
    }

    body.neon .live-clock {
      color: #39ff14;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
    }

    input {
      padding: 8px 12px;
      width: 250px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
    }

    body.light input {
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: white;
      color: black;
    }

    body.dark input {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    body.neon input {
      background: black;
      border: 1px solid #39ff14;
      color: #39ff14;
    }

    .container {
      height: calc(100vh - 150px);
      overflow-y: auto;
      padding: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 0.6fr 2fr 0.8fr 0.6fr 1fr;
      gap: 4px;
      padding: 8px;
      align-items: center;
    }

    .headerRow {
      font-weight: bold;
      font-size: 36px;
      border-bottom: 2px solid currentColor;
      position: sticky;
      top: 0;
      background: #8B008B;
      z-index: 2;
    }

    .cardRow {
      font-size: 36px;
      margin: 6px 0;
      border-radius: 10px;
      padding: 4px;
      background: rgba(255,255,255,0.05);
    }

    body.light .cardRow {
      background: rgba(0,0,0,0.03);
    }

    .new {
      background: rgba(250, 204, 21, 0.35) !important;
      box-shadow: 0 0 15px #facc15;
    }

    body.light .new {
      background: #fef08a !important;
      box-shadow: 0 0 14px #eab308;
      border: 1px solid #facc15;
      color: #000000 !important;
    }

    button {
      margin-left: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }

    select {
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
      font-size: 16px;
    }

    body.dark select {
      background: #111;
      color: white;
    }

    body.light select {
      background: white;
      color: black;
    }

    body.neon select {
      background: black;
      color: #39ff14;
      border: 1px solid #39ff14;
    }

    @media (max-width: 900px) {
      header {
        padding: 10px;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-top div:first-child {
        font-size: 24px !important;
      }

      .header-bottom {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        width: 100%;
        justify-content: flex-start;
      }

      .controls input,
      .controls select {
        width: 100%;
        max-width: none;
      }

      .row {
        grid-template-columns: 0.5fr 2fr 0.8fr 0.8fr 1fr;
        font-size: 20px;
      }

      .headerRow {
        font-size: 22px;
      }

      .cardRow {
        font-size: 20px;
      }
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 0.4fr 1.8fr 0.8fr 0.8fr 1fr;
        font-size: 16px;
      }

      .headerRow {
        font-size: 17px;
      }

      .cardRow {
        font-size: 17px;
      }
    }
  </style>
</head>

<body class="light">

<div id="audioGate">
  <img
    class="gate-logo"
    src="https://images.click.in/classifieds/images/163/30_03_2022_16_53_17_cdcfba6b7278a14ccc1a5bf505bfd512_w.png"
    alt="Podar Logo"
  >

  <div style="font-size: 28px; font-weight: bold;">
    Podar International School, Magadi Road - Dispersals Portal
  </div>

  <div style="font-size: 16px; margin-top: 10px; color: #9ca3af;">
    Click the button below to
  </div>

  <button onclick="unlockAudio()">Proceed Dashboard</button>
</div>

<header>
  <div class="header-top">

    <div style="font-size: 36px; font-weight: bold;">
      Podar International School, Magadi Road - Dispersals Live
    </div>

    <div>
      <button onclick="setTheme('dark')">Dark</button>
      <button onclick="setTheme('light')">Light</button>
      <button onclick="setTheme('neon')">Neon</button>
    </div>

  </div>

  <div class="header-bottom">

    <div class="live-clock" id="liveClock">
      🕒 --:--:-- --
      <span id="connectionStatus">🟡 Checking...</span>
    </div>

    <div class="controls">

      <select id="classFilter" onchange="render()">
        <option value="">All Classes</option>
        <option value="I">I</option>
        <option value="II">II</option>
        <option value="III">III</option>
        <option value="IV">IV</option>
        <option value="V">V</option>
        <option value="VI">VI</option>
        <option value="VII">VII</option>
        <option value="VIII">VIII</option>
        <option value="IX">IX</option>
        <option value="X">X</option>
        <option value="XI">XI</option>
        <option value="XII">XII</option>
      </select>

      <input
        id="search"
        placeholder="🔎 Search..."
        onkeyup="render()"
      >

    </div>
  </div>
</header>

<div class="container" id="container"></div>

<script>
const SUPABASE_URL = 'https://mlnxbihcxytkieeyjmvm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5Anmt0xqsvygyHTrZBGwjw_POSTpqr2';

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const fallbackSound = new Audio("https://google.com");

let rows = [];

const headers = [
  "S_ID",
  "Student Name",
  "Class/Sec",
  "Mode",
  "Time"
];

let lastConnectionOK = false;
let existingIDsSet = new Set();
let initialDataLoaded = false;
let currentISTDate = "";

const voiceQueue = [];
let isVoicePlaying = false;


/* ============================================================
   PARENT ANNOUNCEMENT
   ============================================================ */

const parentAnnouncement =
"Dear Parents!! We are happy to inform you that The MakeX Robotics Championship 20 26 is happening!! and this time it's in Bengaluru!!Checkout the circular shared on whatsapp & loop learning for complete details!. Also a quick update! To skip daily scanning! kindly download & install our Dispersal app! Thankyou!";

const PARENT_ANNOUNCEMENT_INTERVAL = 50000;

let parentAnnouncementRequested = false;
let parentAnnouncementTimer = null;
let parentAnnouncementPlaying = false;


/* ============================================================
   WAKE LOCK
   ============================================================ */

let wakeLock = null;

async function requestWakeLock() {
  if (!("wakeLock" in navigator)) {
    return;
  }

  try {
    wakeLock = await navigator.wakeLock.request("screen");

    wakeLock.addEventListener("release", () => {
      wakeLock = null;
    });

  } catch (err) {
    console.warn("Wake Lock unavailable:", err);
  }
}

async function reacquireWakeLock() {
  if (document.visibilityState !== "visible") {
    return;
  }

  if (!("wakeLock" in navigator)) {
    return;
  }

  if (wakeLock) {
    return;
  }

  await requestWakeLock();
}


/* ============================================================
   AUDIO GATE
   ============================================================ */

function unlockAudio() {
  const gate = document.getElementById("audioGate");

  if (gate) {
    gate.style.display = "none";
  }

  playNotificationSound();

  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
  }

  requestWakeLock();

  startParentAnnouncementTimer();
}


/* ============================================================
   THEME
   ============================================================ */

function setTheme(theme) {
  document.body.className = theme;
  playNotificationSound();
}


/* ============================================================
   VOICE SELECTION
   ============================================================ */

function getIndianVoice() {
  if (!("speechSynthesis" in window)) {
    return null;
  }

  const voices = window.speechSynthesis.getVoices();

  let voice = voices.find(v => {
    const n = String(v.name || "").toLowerCase();
    const l = String(v.lang || "").toLowerCase();

    const indian =
      l.startsWith("en-in") ||
      l.startsWith("hi-in") ||
      n.includes("india");

    const female =
      n.includes("heera") ||
      n.includes("veena") ||
      n.includes("priya") ||
      n.includes("female") ||
      n.includes("zira");

    return indian && female;
  });

  if (!voice) {
    voice = voices.find(v => {
      const n = String(v.name || "").toLowerCase();
      const l = String(v.lang || "").toLowerCase();

      return (
        l.startsWith("en-in") ||
        l.startsWith("hi-in") ||
        n.includes("india")
      );
    });
  }

  return voice || null;
}


/* ============================================================
   STUDENT NAME QUEUE
   ============================================================ */

function speakStudentName(name) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  name = String(name || "").trim();

  if (!name) {
    return;
  }

  voiceQueue.push(name);

  processVoiceQueue();
}


/* ============================================================
   PARENT ANNOUNCEMENT QUEUE CONTROL
   ============================================================ */

function requestParentAnnouncement() {
  if (parentAnnouncementRequested || parentAnnouncementPlaying) {
    return;
  }

  parentAnnouncementRequested = true;

  processVoiceQueue();
}


/* ============================================================
   VOICE PROCESSOR
   ============================================================ */

function processVoiceQueue() {
  if (!("speechSynthesis" in window)) {
    voiceQueue.length = 0;
    parentAnnouncementRequested = false;
    return;
  }

  if (isVoicePlaying) {
    return;
  }


  /* ------------------------------------------------------------
     Parent announcement has priority once the current speech
     has finished.
     ------------------------------------------------------------ */

  if (parentAnnouncementRequested) {
    parentAnnouncementRequested = false;
    speakParentAnnouncement();
    return;
  }


  /* ------------------------------------------------------------
     Nothing to speak.
     ------------------------------------------------------------ */

  if (voiceQueue.length === 0) {
    return;
  }


  /* ------------------------------------------------------------
     Existing student-name logic
     ------------------------------------------------------------ */

  const name = voiceQueue.shift();

  isVoicePlaying = true;

  const msg = new SpeechSynthesisUtterance(name);
  const voice = getIndianVoice();

  if (voice) {
    msg.voice = voice;
  }

  msg.lang = "en-IN";
  msg.rate = 1.10;
  msg.pitch = 1.35;
  msg.volume = 1;

  msg.onend = () => {
    isVoicePlaying = false;

    setTimeout(processVoiceQueue, 250);
  };

  msg.onerror = () => {
    isVoicePlaying = false;

    setTimeout(processVoiceQueue, 100);
  };

  window.speechSynthesis.speak(msg);
}


/* ============================================================
   PARENT ANNOUNCEMENT SPEECH
   ============================================================ */

function speakParentAnnouncement() {
  if (!("speechSynthesis" in window)) {
    parentAnnouncementRequested = false;
    parentAnnouncementPlaying = false;

    /*
     * Even if speech synthesis is unavailable,
     * maintain the exact 50-second interval.
     */
    scheduleNextParentAnnouncement();

    return;
  }

  if (parentAnnouncementPlaying) {
    return;
  }

  parentAnnouncementRequested = false;
  parentAnnouncementPlaying = true;
  isVoicePlaying = true;

  const msg =
    new SpeechSynthesisUtterance(parentAnnouncement);

  const voice = getIndianVoice();

  if (voice) {
    msg.voice = voice;
  }

  msg.lang = "en-IN";
  msg.rate = 1.20;
  msg.pitch = 1.0;
  msg.volume = 1;

  msg.onend = () => {
    parentAnnouncementPlaying = false;
    isVoicePlaying = false;

    /*
     * The 50-second countdown starts AFTER
     * the parent announcement has completely finished.
     */
    scheduleNextParentAnnouncement();

    setTimeout(processVoiceQueue, 250);
  };

  msg.onerror = () => {
    parentAnnouncementPlaying = false;
    isVoicePlaying = false;

    /*
     * Keep the same rigid 50-second interval even
     * if the speech engine reports an error.
     */
    scheduleNextParentAnnouncement();

    setTimeout(processVoiceQueue, 100);
  };

  window.speechSynthesis.speak(msg);
}


/* ============================================================
   PARENT ANNOUNCEMENT TIMER
   ============================================================ */

function scheduleNextParentAnnouncement() {

  if (parentAnnouncementTimer !== null) {
    clearTimeout(parentAnnouncementTimer);
    parentAnnouncementTimer = null;
  }

  parentAnnouncementTimer = setTimeout(() => {

    parentAnnouncementTimer = null;

    requestParentAnnouncement();

  }, PARENT_ANNOUNCEMENT_INTERVAL);
}


function startParentAnnouncementTimer() {

  if (parentAnnouncementTimer !== null) {
    return;
  }

  /*
   * First announcement occurs exactly 50 seconds
   * after Proceed Dashboard is clicked.
   */
  scheduleNextParentAnnouncement();
}


/* ============================================================
   TIME DISPLAY
   ============================================================ */

function getOnlyTime(value) {
  if (!value) {
    return "";
  }

  const d = new Date(value);

  if (isNaN(d.getTime())) {
    return value;
  }

  return d.toLocaleTimeString("en-IN", {
    timeZone: "Asia/Kolkata",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });
}


function getISTDate() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}


/* ============================================================
   LIVE CLOCK
   ============================================================ */

function updateLiveClock() {
  const clock = document.getElementById("liveClock");

  if (!clock) {
    return;
  }

  const time = new Date().toLocaleTimeString("en-IN", {
    timeZone: "Asia/Kolkata",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });

  clock.innerHTML =
    "🕒 " +
    time +
    ' <span id="connectionStatus">' +
    (lastConnectionOK
      ? "🟢 Connected"
      : "🔴 Disconnected") +
    "</span>";
}


/* ============================================================
   NOTIFICATION SOUND
   ============================================================ */

function playNotificationSound() {
  try {
    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContext) {
      const ctx = new AudioContext();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "square";

      osc.frequency.setValueAtTime(
        880,
        ctx.currentTime
      );

      gain.gain.setValueAtTime(
        0.2,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.3
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }

  } catch (e) {}

  try {
    fallbackSound.currentTime = 0;
    fallbackSound.volume = 1;

    const p = fallbackSound.play();

    if (p) {
      p.catch(() => {});
    }

  } catch (e) {}
}


/* ============================================================
   SUPABASE DATA FETCH
   ============================================================ */

async function fetchData() {
  try {
    const istDate = getISTDate();

    if (currentISTDate !== istDate) {
      currentISTDate = istDate;

      existingIDsSet.clear();

      initialDataLoaded = false;

      voiceQueue.length = 0;
    }

    const startOfISTDay =
      new Date(`${istDate}T00:00:00+05:30`);

    const startOfNextISTDay =
      new Date(
        startOfISTDay.getTime() + 86400000
      );

    const {
      data,
      error
    } = await supabaseClient
      .from("arrivals")
      .select(`
        s_id,
        name,
        class_section,
        mode,
        arrival_time
      `)
      .gte(
        "arrival_time",
        startOfISTDay.toISOString()
      )
      .lt(
        "arrival_time",
        startOfNextISTDay.toISOString()
      )
      .order(
        "arrival_time",
        { ascending: false }
      )
      .limit(350);

    if (error) {
      throw error;
    }

    lastConnectionOK = true;

    updateLiveClock();

    const dataRows =
      (data || []).map(item => [
        item.s_id || "",
        item.name || "Unknown Student",
        item.class_section || "",
        item.mode || "",
        item.arrival_time || ""
      ]);

    const newStudents = [];

    dataRows.forEach(row => {
      const id =
        String(row[0] || "").trim();

      const name =
        String(row[1] || "").trim();

      if (!id) {
        return;
      }

      if (!initialDataLoaded) {

        existingIDsSet.add(id);

      } else if (!existingIDsSet.has(id)) {

        existingIDsSet.add(id);

        if (name) {
          newStudents.push(name);
        }
      }
    });

    initialDataLoaded = true;

    if (newStudents.length) {

      playNotificationSound();

      newStudents
        .reverse()
        .forEach(name => {
          speakStudentName(name);
        });
    }

    rows = dataRows;

    render();

  } catch (err) {

    lastConnectionOK = false;

    updateLiveClock();

    console.error(
      "SUPABASE ERROR:",
      err
    );
  }
}


/* ============================================================
   RENDER
   ============================================================ */

function render() {
  const search =
    document.getElementById("search");

  const classFilter =
    document.getElementById("classFilter");

  const container =
    document.getElementById("container");

  if (
    !search ||
    !classFilter ||
    !container
  ) {
    return;
  }

  const q =
    search.value
      .toLowerCase()
      .trim();

  const selectedClass =
    classFilter.value;

  const filtered =
    rows.filter(r => {

      const matchesSearch =
        (r || [])
          .join(" ")
          .toLowerCase()
          .includes(q);

      const classSection =
        String(r[2] || "").trim();

      const matchesClass =
        selectedClass === "" ||
        classSection === selectedClass ||
        classSection.startsWith(
          selectedClass + " - "
        );

      return (
        matchesSearch &&
        matchesClass
      );
    });

  let html =
    '<div class="row headerRow">';

  headers.forEach(h => {
    html += `<div>${h || ""}</div>`;
  });

  html += "</div>";

  filtered.forEach((r, i) => {

    html +=
      `<div class="row cardRow ${i === 0 ? "new" : ""}">`;

    r.forEach((cell, idx) => {

      let value = cell;

      if (idx === r.length - 1) {
        value = getOnlyTime(cell);
      }

      html +=
        `<div>${value || ""}</div>`;
    });

    html += "</div>";
  });

  container.innerHTML = html;
}


/* ============================================================
   INITIALIZATION
   ============================================================ */

updateLiveClock();

setInterval(
  updateLiveClock,
  1000
);

fetchData();

setInterval(
  fetchData,
  2000
);


/* ============================================================
   SPEECH VOICE INITIALIZATION
   ============================================================ */

if ("speechSynthesis" in window) {

  window.speechSynthesis.onvoiceschanged =
    () => {
      window.speechSynthesis.getVoices();
    };
}


/* ============================================================
   WAKE LOCK RE-ACQUISITION
   ============================================================ */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState === "visible"
    ) {
      reacquireWakeLock();
    }
  }
);

window.addEventListener(
  "focus",
  () => {
    reacquireWakeLock();
  }
);

</script>

</body>
</html>
