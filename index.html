<!DOCTYPE html>
<html>
<head>
  <title>Dispersals Live</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      transition: 0.3s;
    }

    body.dark { background:black; color:white; }
    body.light { background:#f1f5f9; color:black; }
    body.neon { background:#030712; color:#39ff14; }

    #audioGate {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }
    
    .gate-logo {
      max-width: 600px;
      height: auto;
      margin-bottom: 30px;
      object-fit: contain;
    }

    #audioGate button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 20px #facc15;
    }

    header {
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      background: #111827;
      color: yellow;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .live-clock {
      font-size: 20px;
      font-weight: bold;
      color: #9ca3af; 
      font-family: monospace; 
    }

    body.neon .live-clock { color: #39ff14; }

    .controls { display: flex; justify-content: flex-end; }

    input {
      padding: 8px 12px;
      width: 250px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
    }

    body.light input { border: 1px solid rgba(0, 0, 0, 0.15); background: white; color: black; }
    body.dark input { background: rgba(255,255,255,0.05); color: white; }
    body.neon input { background: black; border: 1px solid #39ff14; color: #39ff14; }

    .container {
      height: calc(100vh - 150px); 
      overflow-y: auto;
      padding: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 0.6fr 2fr 0.8fr 0.6fr 1fr; 
      gap: 4px;
      padding: 8px;
      align-items: center;
    }

    .headerRow {
      font-weight: bold;
      font-size: 36px;
      border-bottom: 2px solid currentColor;
      position: sticky;
      top: 0;
      background: #8B008B;
      z-index: 2;
    }

    .cardRow {
      font-size: 36px;
      margin: 6px 0;
      border-radius: 10px;
      padding: 4px;
      background: rgba(255,255,255,0.05);
    }

    body.light .cardRow { background: rgba(0,0,0,0.03); }

    .new {
      background: rgba(250, 204, 21, 0.35) !important; 
      box-shadow: 0 0 15px #facc15; 
    }

    body.light .new {
      background: #fef08a !important; 
      box-shadow: 0 0 14px #eab308;    
      border: 1px solid #facc15;       
      color: #000000 !important;       
    }

    button {
      margin-left: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }

    select {
      padding: 8px 12px;
      border-radius: 6px;
      margin-right: 8px;
      font-size: 16px;
    }

    body.dark select { background: #111; color: white; }
    body.light select { background: white; color: black; }
    body.neon select { background: black; color: #39ff14; border: 1px solid #39ff14; }

    @media (max-width: 900px) {
      header { padding: 10px; }
      .header-top { flex-direction: column; align-items: flex-start; }
      .header-top div:first-child { font-size: 24px !important; }
      .header-bottom { flex-direction: column; align-items: stretch; }
      .controls { width: 100%; justify-content: flex-start; }
      .controls input, .controls select { width: 100%; max-width: none; }
      .row { grid-template-columns: 0.5fr 2fr 0.8fr 0.8fr 1fr; font-size: 20px; }
      .headerRow { font-size: 22px; }
      .cardRow { font-size: 20px; }
    }

    @media (max-width: 600px) {
      .row { grid-template-columns: 0.4fr 1.8fr 0.8fr 0.8fr 1fr; font-size: 16px; }
      .headerRow { font-size: 17px; }
      .cardRow { font-size: 17px; }
    }
  </style>
</head>

<body class="light">

<div id="audioGate">
  <img class="gate-logo" src="https://images.click.in/classifieds/images/163/30_03_2022_16_53_17_cdcfba6b7278a14ccc1a5bf505bfd512_w.png" alt="Podar Logo">
  <div style="font-size: 28px; font-weight: bold;"> Podar International School, Magadi Road - Dispersals Portal </div>
  <div style="font-size: 16px; margin-top: 10px; color: #9ca3af;"> Click the button below to</div>
  <button onclick="unlockAudio()">Proceed Dashboard</button>
</div>

<header>
  <div class="header-top">
    <div style="font-size: 36px; font-weight: bold;"> Podar International School, Magadi Road - Dispersals Live </div>
    <div>
      <button onclick="setTheme('dark')">Dark</button>
      <button onclick="setTheme('light')">Light</button>
      <button onclick="setTheme('neon')">Neon</button>
    </div>
  </div>

  <div class="header-bottom">
    <div class="live-clock" id="liveClock">🕒 --:--:-- -- <span id="connectionStatus">🟡 Checking...</span></div>
    <div class="controls">
      <select id="classFilter" onchange="render()">
        <option value="">All Classes</option>
        <option>I R</option>
        <option>I L</option>
        <option>II R</option>
        <option>II L</option>
        <option>III R</option>
        <option>III L</option>
        <option>IV R</option>
        <option>IV L</option>
        <option>V R</option>
        <option>V L</option>
        <option>VI R</option>
        <option>VI L</option>
        <option>VII R</option>
        <option>VII L</option>
        <option>VIII R</option>
        <option>VIII L</option>
        <option>IX R</option>
        <option>IX L</option>
        <option>X R</option>
        <option>X L</option>
        <option>XI</option>
        <option>XII</option>
      </select>
      <input id="search" placeholder="🔎 Search..." onkeyup="render()" />
    </div>
  </div>
</header>

<div class="container" id="container"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbx5H1nE9qRgtuvNfEeJZ6GUqnFP9_59sLObLB1FrOZXryB5VwZoaA4EcKkzGE0JaX3f8A/exec";
const fallbackSound = new Audio("https://google.com");

let rows = [];
let headers = [];
let lastConnectionOK = false;
let existingIDsSet = new Set(); 
let isInitialLoad = true;
let audioUnlocked = true; // Default to true so sound functions execute normally after clicking the gate button

// Speech Queue Control Variables
let speechQueue = [];
let isSpeaking = false;
let systemVoices = [];

// Preload and track system voices safely across browsers
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  systemVoices = window.speechSynthesis.getVoices();
}

if ("speechSynthesis" in window) {
  loadVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
}

function unlockAudio() {
  audioUnlocked = true;
  document.getElementById("audioGate").style.display = "none";
  playNotificationSound();
  
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const dummy = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(dummy);
  }

  // Trigger initial top student announcement safely AFTER user clicks proceed
  if (rows.length > 0) {
    const topStudentName = rows[0][1];
    if (topStudentName) {
      playNotificationSound();
      queueStudentName(topStudentName);
    }
  }
}

function setTheme(t) {
  document.body.className = t;
  playNotificationSound();
}

/* Safe Sequenced Speech Queue Manager preserving exact Indian Female profile and pacing */
function queueStudentName(name) {
  speechQueue.push(name);
  speechQueue.push(name); // Speaks twice sequentially in exact arrival order
  processSpeechQueue();
}

function processSpeechQueue() {
  if (isSpeaking || speechQueue.length === 0) return;
  if (!("speechSynthesis" in window)) return;

  isSpeaking = true;
  const nameToSpeak = speechQueue.shift();

  const msg = new SpeechSynthesisUtterance(nameToSpeak);
  
  if (systemVoices.length === 0) {
    systemVoices = window.speechSynthesis.getVoices();
  }

  // 1. Search specifically for known Indian female voices and regional profiles
  let femaleIndianVoice = systemVoices.find(v => {
    const nameLower = v.name.toLowerCase();
    const langLower = v.lang.toLowerCase();
    
    const isIndian = langLower.startsWith("en-in") || langLower.startsWith("hi-in") || nameLower.includes("india");
    const isFemale = nameLower.includes("heera") || 
                     nameLower.includes("veena") || 
                     nameLower.includes("priya") || 
                     nameLower.includes("female") ||
                     nameLower.includes("zira");

    return isIndian && isFemale;
  });

  // 2. Fallback to any Indian English voice if a specific female one isn't found
  if (!femaleIndianVoice) {
    femaleIndianVoice = systemVoices.find(v => 
      v.lang.startsWith("en-in") || v.name.toLowerCase().includes("india")
    );
  }

  // 3. Apply the voice if discovered
  if (femaleIndianVoice) {
    msg.voice = femaleIndianVoice;
  }

  msg.lang = "en-IN";
  msg.rate = 0.72;   // Maintained original slow, clear pace for children's names
  msg.pitch = 1.35;  // Maintained original higher pitch for natural female synthesis
  msg.volume = 1.0;

  msg.onend = function() {
    isSpeaking = false;
    setTimeout(processSpeechQueue, 400); // Maintained breathable sequential gap
  };

  msg.onerror = function() {
    isSpeaking = false;
    processSpeechQueue();
  };

  window.speechSynthesis.speak(msg);
}

function getOnlyTime(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
}

function updateLiveClock() {
  const now = new Date();
  const timeString = now.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });

  document.getElementById("liveClock").innerHTML =
    "🕒 " + timeString + 
    ' <span id="connectionStatus">' +
    (lastConnectionOK ? "🟢 Connected" : "🔴 Disconnected") +
    "</span>";
}

function playNotificationSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }
  } catch (e) {
    console.log("Synthesizer bypassed");
  }

  try {
    fallbackSound.currentTime = 0;
    fallbackSound.volume = 2.0;
    fallbackSound.play();
  } catch (e) {
    console.log("Media channel exception bypass");
  }
}

async function fetchData() {
  try {
    const res = await fetch(API + "?t=" + Date.now());
    const json = await res.json();
    lastConnectionOK = true;
    updateLiveClock();
    const currentRows = json.rows || [];

    if (currentRows.length > 1) {
      headers = currentRows[0] || [];
      const dataRows = currentRows.slice(1);

      let newlyDetectedRows = [];

      dataRows.forEach(row => {
        const rowID = String(row[0] || "").trim();
        if (rowID !== "") {
          if (!existingIDsSet.has(rowID)) {
            if (!isInitialLoad) {
              newlyDetectedRows.push(row);
            }
            existingIDsSet.add(rowID);
          }
        }
      });

      if (isInitialLoad) {
        isInitialLoad = false;
        // Populate existing IDs on first load so they aren't treated as new
      } else if (newlyDetectedRows.length > 0) {
        playNotificationSound();
        newlyDetectedRows.forEach(row => {
          const studentName = row[1];
          if (studentName) {
            queueStudentName(studentName);
          }
        });
      }

      rows = dataRows;
      render();
    }
  } catch (err) {
    lastConnectionOK = false;
    updateLiveClock();
    console.error("API ERROR:", err);
  }
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const container = document.getElementById("container");
  const selectedClass = document.getElementById("classFilter").value;

  const filtered = rows.filter(r => {
    const matchesSearch = (r || []).join(" ").toLowerCase().includes(q);
    const matchesClass = selectedClass === "" || String(r[2]).trim() === selectedClass;
    return matchesSearch && matchesClass;
  });

  let html = "";

  html += `<div class="row headerRow">`;
  headers.forEach(h => {
    html += `<div>${h || ""}</div>`;
  });
  html += `</div>`;

  filtered.forEach((r, i) => {
    html += `<div class="row cardRow ${i === 0 ? 'new' : ''}">`;

    r.forEach((cell, idx) => {
      let value = cell;
      if (idx === r.length - 1) {
        value = getOnlyTime(cell);
      }
      html += `<div>${value || ""}</div>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

updateLiveClock();
setInterval(updateLiveClock, 1000);

fetchData();
setInterval(fetchData, 1200);

</script>

</body>
</html>
